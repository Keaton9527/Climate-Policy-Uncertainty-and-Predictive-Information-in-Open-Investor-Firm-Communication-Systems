title: Climate Policy Uncertainty and Predictive Information in Open Investor–Firm Communication Systems
release_date: 2026-10-29
kind: publication_code_assembly
new_experiment: false
source_experiments: ['001', '007', '008', '012', '013', '015', '016', '017', '021']
entrypoint: run.py
configuration: config/paper.yaml
requirements: requirements.txt
source_hashes: docs/SOURCE_LINEAGE.json
validation: docs/VALIDATION.md
random_seed: 42
sample:
  stocks: 61
  modeling_firm_days: 108244
  out_of_sample_firm_days: 73528
  out_of_sample_dates: 1212
  windows: 10
  train_months: 24
  validation_months: 6
  test_months: 6
  step_months: 6
bootstrap:
  repetitions: 5000
  block_length_dates: 20
  ccpu_sampling: full_ordered_test_dates
  source_sampling: within_each_fixed_window
inputs:
  - baseline.parquet
  - interactions.csv
  - nev_index.xlsx
  - ccpu.xlsx
  - epu.xlsx
  - exposure.xlsx
  - exposure_words.xlsx
outputs: configured_output_directory
included_scope:
  - historical_technical_and_daily_panel_preparation
  - rolling_technical_selection_and_five_classifiers
  - source_and_market_regime_ablation
  - ccpu_joint_states_and_36_contrast_adjustment
  - residual_ccpu_reply_MCC
  - raw_ccpu_reply_probability_loss_regression
  - transition_exposure_signed_difference_in_differences
  - paired_source_and_environment_comparisons
excluded_scope:
  - portfolio_backtests
  - SHAP
  - paused_annotation_study
  - withdrawn_experiments
  - unreported_sensitivity_branches
private_data_included: false
