seed: 42
jobs: 4
paths:
  baseline: ../../private/baseline.parquet
  nev_index: ../../private/nev_index.xlsx
  interaction_features: ../../private/interactions.csv
  ccpu: ../../private/ccpu.xlsx
  epu: ../../private/epu.xlsx
  exposure: ../../private/exposure.xlsx
  exposure_words: ../../private/exposure_words.xlsx
  output: ../../outputs/01_empirical
sample:
  start: 2017-01-01
  end: 2024-06-30
  first_validation_start: 2019-01-01
  train_months: 24
  validation_months: 6
  test_months: 6
  step_months: 6
  expected_windows: 10
  expected_stocks: 61
  expected_prediction_dates: 1212
features:
  technical_candidates:
  - change
  - pct_chg
  - volume
  - amount
  - swing
  - DIFF
  - DEA
  - MACD
  - MA10
  - RSI
  - CCI
  - K
  - D
  - J
  - ROCP
  fixed_technical:
  - MA10
  - MACD
  - DIFF
  - ROCP
  question:
  - ques_counts
  - ques_length
  - ques_sentiment_score
  answer:
  - ans_counts
  - ans_length
  - ans_sentiment_score
  - ans_time_diff
  - ans_similarity
selection:
  strong_methods_required: 3
  random_forest_trees: 40
  random_forest_max_depth: 8
  null_iterations: 10
  l1_cv_splits: 3
threshold:
  minimum: 0.1
  maximum: 0.9
  step: 0.01
models:
  logistic_regression:
    max_iter: 1000
  random_forest:
    n_estimators: 100
  mlp:
    hidden_layer_sizes:
    - 100
    - 50
    max_iter: 300
    early_stopping: true
  svc:
    kernel: linear
    c: 0.1
    max_iter: 5000
  xgboost:
    n_estimators: 2000
    learning_rate: 0.08
    max_depth: 6
    min_child_weight: 7
    subsample: 1.0
    colsample_bytree: 0.6
    gamma: 5
    early_stopping_rounds: 50
ccpu:
  sheet: Daily
  lag_days: 1
  low_quantile: 0.25
  high_quantile: 0.75
bootstrap:
  repetitions: 5000
  block_length: 20
  seed: 42
